# Tests and smoke checks for every push to main and every pull request. The browser test
# (tests/test_browser.py) is skipped in the pytest jobs and runs in the "browser" job, which
# installs Playwright and Chromium.
# The suite runs on demo (synthetic) data, so it never depends on Yahoo, FRED, CBS or the
# Bank of Israel being reachable.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STOCKPLAN_DEMO: "1"

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    name: web UI and app start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in stockplan/web/js/*.js; do node --check "$f" || exit 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: The app starts and answers
        run: |
          python -m uvicorn stockplan.api:app --port 8765 > server.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8765/api/status > /dev/null && break; sleep 1; done
          curl -sf localhost:8765/api/status
          curl -sf localhost:8765/ | grep -q 'id="app"'
          for f in stockplan/web/js/*.js stockplan/web/styles.css; do
            curl -sf -o /dev/null "localhost:8765/${f#stockplan/web/}" || { echo "missing $f"; exit 1; }
          done
          curl -sf -X POST localhost:8765/api/property/simulate -H 'Content-Type: application/json' \
            -d '{"common":{"years":10,"equity":800000,"budget":8000},"scenarios":[{"id":"m","alloc":0},{"id":"a","alloc":100,"price":2000000,"rent":5000,"tracks":[{"share":100,"years":25,"rate":5}]}]}' \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert len(d["scenarios"]) == 2, d'
      - name: Server log
        if: failure()
        run: cat server.log

  browser:
    name: browser test (every tab, account settings, phone layout)
    # Playwright 1.56 installs Chromium only on the Ubuntu versions it supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_browser.py
